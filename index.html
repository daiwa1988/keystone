<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keystone</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#E8EDE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keystone">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, one scrolling view, bottom tab bar, bottom sheets for forms */
:root{
  --bg:#E8EDE9; --surface:#FFFFFF; --surface2:#F2F5F2; --ink:#14221D; --muted:#5A6A63; --line:#D3DCD6;
  --accent:#1D5C4B; --accent-ink:#FFFFFF; --accent-soft:#DAEAE2;
  --ochre:#9C6610; --ochre-soft:#F5E8CC;
  --bad:#A63D2C; --bad-soft:#F6DDD7; --warn:#8F5E00; --warn-soft:#F6E9C8; --good:#2B7653; --good-soft:#D8EDE1;
  --imm:#1D5C4B; --mov:#7FA898;
  --hero:#163D33; --hero-ink:#F0F6F3; --hero-muted:#A8C3B8; --hero-line:#2C5A4D;
  --shadow:0 1px 2px rgba(20,34,29,.06),0 6px 20px rgba(20,34,29,.06);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#17211D; --surface2:#1C2823; --ink:#E4ECE8; --muted:#95A69E; --line:#2A3832;
  --accent:#6FC0A0; --accent-ink:#0E1513; --accent-soft:#1E3A30;
  --ochre:#DDA94A; --ochre-soft:#3A2E17;
  --bad:#E8907F; --bad-soft:#3D221D; --warn:#E2B357; --warn-soft:#382D15; --good:#7CC9A0; --good-soft:#1C3428;
  --imm:#6FC0A0; --mov:#3D6B5C;
  --hero:#12302A; --hero-ink:#EAF3EF; --hero-muted:#8FB3A5; --hero-line:#24493F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211D; --surface2:#1C2823; --ink:#E4ECE8; --muted:#95A69E; --line:#2A3832;
  --accent:#6FC0A0; --accent-ink:#0E1513; --accent-soft:#1E3A30;
  --ochre:#DDA94A; --ochre-soft:#3A2E17;
  --bad:#E8907F; --bad-soft:#3D221D; --warn:#E2B357; --warn-soft:#382D15; --good:#7CC9A0; --good-soft:#1C3428;
  --imm:#6FC0A0; --mov:#3D6B5C;
  --hero:#12302A; --hero-ink:#EAF3EF; --hero-muted:#8FB3A5; --hero-line:#24493F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}

*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.lock{position:fixed;inset:0;z-index:100;background:var(--hero);color:var(--hero-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));text-align:center}
.lock .brand{color:var(--hero-ink);font-size:34px}
.lock .brand small{color:var(--hero-muted)}
.lock input{font:inherit;font-size:28px;letter-spacing:.4em;text-align:center;width:220px;max-width:100%;padding:12px;border-radius:14px;border:1px solid var(--hero-line);background:rgba(255,255,255,.08);color:var(--hero-ink)}
.lock .msg{min-height:20px;font-size:13px;color:#F2B8AC}
.lock .forgot{font-size:12px;color:var(--hero-muted);max-width:300px}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-size:24px;letter-spacing:.2px;color:var(--accent)}
.brand small{display:block;font-family:var(--f-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:-2px}
.top .sp{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--ochre-soft);color:var(--ink);font-size:13px;margin-bottom:12px}
.banner b{color:var(--ochre)}
.banner.bad{background:var(--bad-soft)}
.banner .act{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:700;white-space:nowrap;padding:0}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:20px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:1px solid var(--hero-line);box-shadow:0 0 0 22px transparent,0 0 0 23px var(--hero-line)}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.hero .eyebrow{color:var(--hero-muted)}
.nw{font-family:var(--f-display);font-size:clamp(34px,10vw,44px);line-height:1.05;margin:6px 0 2px;position:relative;z-index:1}
.nw .cur{font-size:.5em;vertical-align:.55em;margin-right:4px;color:var(--hero-muted)}
.asat{font-size:12px;color:var(--hero-muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;border-top:1px solid var(--hero-line);padding-top:12px;position:relative;z-index:1}
.stat .k{font-size:11px;color:var(--hero-muted)}
.stat .v{font-weight:700;font-size:14px}
.split{margin-top:14px;position:relative;z-index:1}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--hero-line)}
.bar i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--hero-muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}

/* sections */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0}
.sec-h .meta{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .r{text-align:right;flex-shrink:0}
.row .r .v{font-weight:700;font-size:14.5px}
.row .r .s{font-size:12px}
.grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px 6px;background:var(--surface2);border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.mini{height:4px;border-radius:9px;background:var(--surface2);margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent);border-radius:9px}
.chev{width:16px;height:16px;stroke:var(--muted);flex-shrink:0}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--surface2);color:var(--muted)}
.p-ex{background:var(--ochre-soft);color:var(--ochre)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

.attn .row .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:13px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:18px;margin-bottom:4px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{font-weight:500;opacity:.75;margin-left:4px}

.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.tot{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.tot .k{font-size:11.5px;color:var(--muted)}
.tot .v{font-weight:700;font-size:16px}

.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.progress{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--good)}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}
.fab{position:fixed;right:max(16px,calc(50% - 264px),env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;border:0;border-radius:16px;padding:13px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}
.fab svg{width:18px;height:18px;stroke:currentColor}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:86%}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;flex:1}
.sheet-b{overflow-y:auto;padding:14px 18px 8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet-f{display:flex;gap:8px;padding:12px 18px 14px;border-top:1px solid var(--line)}
.sheet-f .sp{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:span 2;min-width:0}
.fld.h{grid-column:span 1}
@media (max-width:360px){.fld.h{grid-column:span 2}}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--muted)}
.calc{grid-column:span 2;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.err{grid-column:span 2;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin:2px 0 0}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.picker button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;text-align:left;font-weight:600;font-size:14px}
.picker button small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;font-size:13.5px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.confirm .r{display:flex;gap:8px}

.act-link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:4px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions .btn{flex:1 1 140px}
.paper{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13px}
.paper .ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.paper h4{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.06em}
.paper .meta{text-align:right;color:var(--muted);font-size:12px}
.paper .meta b{color:var(--ink)}
.paper .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.paper .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.paper .line{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.paper .total{display:flex;justify-content:space-between;font-weight:800;font-size:16px;border-top:2px solid var(--ink);margin-top:10px;padding-top:8px}
.paper .stamp{margin-top:10px;font-weight:800;color:var(--good)}
.paybox{background:var(--surface2);border-radius:12px;padding:12px;margin-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>
<body>
<div class="lock" id="lock" hidden><div class="brand">Keystone<small>Enter passcode</small></div><form id="lock-form" novalidate style="display:flex;flex-direction:column;align-items:center;gap:12px"><input id="lock-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" aria-label="Passcode"><button class="btn" type="submit" style="min-width:160px">Unlock</button></form><div class="msg" id="lock-msg"></div><p class="forgot">Forgot it? Clear this app's site data in your browser settings, then restore from your latest backup.</p></div>
<div class="app">
  <header class="top">
    <div class="brand">Keystone<small>Wealth planner</small></div>
    <div class="sp"></div>
    <button class="iconbtn" id="btn-settings" data-act="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div id="status"></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" hidden data-act="add">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fab-l">Add</span>
</button>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-nav="overview"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overview</button>
  <button data-nav="assets"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Assets</button>
  <button data-nav="loans"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Loans</button>
  <button data-nav="rentals"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg>Rentals</button>
  <button data-nav="succession"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Succession</button>
</div></nav>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="jspdf.umd.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = v => { if (v === '' || v == null) return null; const x = Number(String(v).replace(/,/g, '')); return isFinite(x) ? x : null; };
const RM = v => v == null ? '–' : 'RM ' + Math.round(v).toLocaleString('en-MY');
const pct = v => v == null ? '' : (Math.round(v * 10) / 10) + '%';
const toD = s => { const d = new Date(s + 'T00:00:00'); return isNaN(d) ? null : d; };
const fmtDate = s => { const d = s && toD(s); return d ? d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : ''; };
const fmtMon = s => { const d = s && toD(s); return d ? d.toLocaleDateString('en-GB', {month:'short', year:'numeric'}) : ''; };

/* ---------- calculations ---------- */
const gp = () => n(st.settings.goldPrice);
const goldAuto = i => n(i.weight) > 0 && n(i.purity) > 0 && gp() > 0;
function value(i){
  switch(i.kind){
    case 'land': { const v = n(i.marketValue); return v == null ? null : v * (n(i.share) ?? 100) / 100; }
    case 'vehicle': return n(i.value);
    case 'gold': return goldAuto(i) ? n(i.weight) * n(i.purity) * gp() : n(i.manual);
    case 'deposit': { const b = n(i.balance); return b == null ? null : b * (n(i.fx) ?? 1); }
    case 'invest': return (n(i.units) != null && n(i.price) != null) ? n(i.units) * n(i.price) : n(i.manual);
    case 'insurance': return n(i.cashValue);
    case 'loan': { const o = n(i.outstanding); return o == null ? null : o * (n(i.share) ?? 100) / 100; }
  } return null;
}
function income(i){
  const v = value(i);
  switch(i.kind){
    case 'deposit': return v != null && n(i.rate) != null ? v * n(i.rate) / 100 : null;
    case 'invest': return v != null && n(i.yield) != null ? v * n(i.yield) / 100 : null;
    case 'insurance': return n(i.payout);
    case 'loan': return null;
    case 'land': { const m = n(i.income); if (m != null) return m; const r = rentReceived12(i.name); return r ? r * (n(i.share) ?? 100) / 100 : null; }
    case 'vehicle': case 'gold': return n(i.income);
    default: return null;
  }
}
/* ---------- rentals ---------- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const thisPeriod = () => today().slice(0, 7);
const periodLabel = p => { if (!p) return ''; const [y, m] = p.split('-'); return MONTHS[+m - 1] + ' ' + y; };
const rents = () => kindItems('rent');
const tenants = () => kindItems('tenant');
const activeTenants = () => tenants().filter(t => (t.status || 'Active') === 'Active');
const paidAmt = r => n(r.paidAmount) ?? 0;
const owing = r => Math.max(0, (n(r.amount) ?? 0) - paidAmt(r));
function rentStatus(r){
  if ((n(r.amount) ?? 0) > 0 && owing(r) === 0) return 'Paid';
  const late = daysUntil(r.due) != null && daysUntil(r.due) < 0;
  if (paidAmt(r) > 0) return late ? 'Part paid · overdue' : 'Part paid';
  return late ? 'Overdue' : 'Due';
}
const rentTone = s => s === 'Paid' ? 'p-ok' : s.includes('verdue') ? 'p-bad' : 'p-warn';
function rentReceived12(propName){
  if (!propName) return 0;
  return sum(rents().filter(r => r.property === propName && daysSince(r.paidOn) != null && daysSince(r.paidOn) <= 365), paidAmt);
}
function dueDateFor(period, day){
  const [y, m] = period.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const d = Math.min(Math.max(1, Math.round(n(day) ?? 7)), last);
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function nextInvoiceNo(issued){
  const yr = (issued || today()).slice(0, 4), pre = (st.settings.invPrefix || 'INV').trim() || 'INV';
  let max = 0;
  for (const r of rents()){ const m = String(r.invoiceNo || '').match(/-(\d{4})-(\d+)$/); if (m && m[1] === yr) max = Math.max(max, +m[2]); }
  for (const r of pendingNos) { const m = r.match(/-(\d{4})-(\d+)$/); if (m && m[1] === yr) max = Math.max(max, +m[2]); }
  const no = `${pre}-${yr}-${String(max + 1).padStart(4, '0')}`; pendingNos.push(no); return no;
}
const pendingNos = [];
function makeRent(t, period, over = {}){
  const issued = over.issued || today();
  return {kind:'rent', tenantId:t.id, tenant:t.name, property:t.property || '', unit:t.unit || '', address:t.address || '', period,
    amount:String(n(over.amount) ?? n(t.rent) ?? 0), issued, due: over.due || dueDateFor(period, t.dueDay),
    desc: over.desc || `Rent for ${periodLabel(period)}`, invoiceNo: nextInvoiceNo(issued), updatedAt:new Date().toISOString()};
}
const missingThisMonth = () => { const p = thisPeriod(); return activeTenants().filter(t => !rents().some(r => r.tenantId === t.id && r.period === p)); };
const valDate = i => i.kind === 'gold' && goldAuto(i) ? st.settings.goldDate : i.valuedOn;
function freshness(i){
  if (value(i) == null) return null;
  const d = daysSince(valDate(i));
  if (d == null) return 'nodate';
  return d > ((i.kind === 'deposit' || i.kind === 'loan') ? 90 : 365) ? 'stale' : 'ok';
}
const contingent = i => (i.type || '').includes('contingent');
const catOf = i => CATS.find(c => c.m(i));
const assetItems = () => [...st.items.entries()].filter(([,i]) => catOf(i)).map(([id,i]) => ({id, ...i}));
const kindItems = k => [...st.items.entries()].filter(([,i]) => i.kind === k).map(([id,i]) => ({id, ...i}));
const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) ?? 0), 0);

function totals(){
  const assets = assetItems();
  const byCat = CATS.map(c => { const its = assets.filter(c.m); return {...c, items:its, value:sum(its, value), income:sum(its, income), stale:its.filter(i => freshness(i) === 'stale').length}; });
  const total = sum(byCat, c => c.value), imm = sum(byCat.filter(c => c.g === 'imm'), c => c.value);
  const loans = kindItems('loan');
  const liab = sum(loans.filter(l => !contingent(l)), value), cont = sum(loans.filter(contingent), value);
  const monthly = sum(loans.filter(l => !contingent(l)), l => n(l.monthly));
  return {byCat, total, imm, mov: total - imm, liab, cont, monthly, income: sum(byCat, c => c.income), net: total - liab};
}

function subline(i){
  const p = [];
  switch(i.kind){
    case 'land': if (n(i.acres)) p.push(i.acres + ' ac'); p.push(i.crop || i.cat); if (i.lot) p.push(i.lot); break;
    case 'vehicle': p.push(i.type, i.year, i.owner); break;
    case 'gold': if (n(i.weight)) p.push(i.weight + ' g' + (n(i.purity) ? ' · ' + i.purity : '')); else p.push(i.type); if (i.keptAt) p.push(i.keptAt); break;
    case 'deposit': p.push(i.type, i.heldBy); if (n(i.rate)) p.push(pct(n(i.rate)) + ' p.a.'); break;
    case 'invest': p.push(i.type); if (n(i.units)) p.push(Number(i.units).toLocaleString('en-MY') + ' units'); if (i.platform) p.push(i.platform); break;
    case 'insurance': p.push(i.type, i.insurer); if (n(i.sumAssured)) p.push('Cover ' + RM(n(i.sumAssured))); break;
    case 'loan': p.push(i.type, i.lender); if (n(i.rate)) p.push(pct(n(i.rate))); break;
  }
  return p.filter(Boolean).join(' · ');
}
function freshPill(i){
  const f = freshness(i);
  if (i.kind === 'gold' && n(i.weight) > 0 && n(i.purity) > 0 && !gp()) return '<span class="pill p-warn">Set gold price</span>';
  if (f === 'stale') return `<span class="pill p-warn">${(i.kind==='deposit'||i.kind==='loan') ? 'Update' : 'Revalue'} · ${esc(fmtMon(valDate(i)))}</span>`;
  if (f === 'nodate') return '<span class="pill p-mute">No date</span>';
  if (f === 'ok') return `<span class="pill p-ok">${esc(fmtMon(valDate(i)))}</span>`;
  return '';
}
const exPill = i => i.example ? ' <span class="pill p-ex">Example</span>' : '';
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';

function itemRow(i, showIncome = true){
  const v = value(i), inc = income(i);
  return `<button class="row" data-act="edit" data-id="${esc(i.id)}">
    <div class="main"><div class="t">${esc(i.name || 'Untitled')}${exPill(i)}</div><div class="s">${esc(subline(i))}</div></div>
    <div class="r"><div class="v num">${v == null ? '<span class="pill p-mute">No value</span>' : esc(RM(v))}</div>
    <div class="s num">${showIncome && inc ? esc(RM(inc)) + '/yr' : ''}</div><div>${freshPill(i)}</div></div></button>`;
}

function attention(){
  const out = [];
  const golds = kindItems('gold').filter(i => n(i.weight) > 0 && n(i.purity) > 0);
  if (golds.length && !gp()) out.push({t:"Set today's gold price", s:`${golds.length} gold item${golds.length > 1 ? 's' : ''} can't be valued yet`, tone:'warn', act:'data-act="settings"'});
  for (const i of [...assetItems(), ...kindItems('loan')]){
    const f = freshness(i);
    if (f === 'stale') out.push({t:i.name, s:`Last valued ${fmtDate(valDate(i))}`, tone:'warn', act:`data-act="edit" data-id="${esc(i.id)}"`});
  }
  const dues = [['vehicle','renewalDue','Insurance / road tax due'],['deposit','maturity','Deposit matures'],['insurance','premiumDue','Premium due'],['loan','maturity','Loan matures']];
  for (const [k, f, label] of dues) for (const i of kindItems(k)){
    const d = daysUntil(i[f]);
    if (d != null && d <= 60 && d >= -30) out.push({t:i.name, s:`${label} ${d < 0 ? 'was' : 'on'} ${fmtDate(i[f])}`, tone: d < 0 ? 'bad' : 'warn', act:`data-act="edit" data-id="${esc(i.id)}"`});
  }
  for (const i of kindItems('insurance')) if (i.nomType === 'None') out.push({t:i.name, s:'No nominee on this policy', tone:'bad', act:`data-act="edit" data-id="${esc(i.id)}"`});
  const est = estateRows(), notStarted = est.filter(e => e.status === 'Not started' || e.status === 'Needs update');
  if (notStarted.length) out.push({t:'Estate plan', s:notStarted.slice(0,3).map(e => e.title).join(', ') + (notStarted.length > 3 ? ` and ${notStarted.length - 3} more` : ''), tone:'bad', act:'data-nav="succession" data-sub="plan"'});
  const overdue = rents().filter(r => owing(r) > 0 && daysUntil(r.due) != null && daysUntil(r.due) < 0);
  for (const r of overdue) out.unshift({t:`Rent overdue · ${r.tenant}`, s:`${RM(owing(r))} for ${periodLabel(r.period)}, due ${fmtDate(r.due)}`, tone:'bad', act:`data-act="invoice" data-id="${esc(r.id)}"`});
  const miss = missingThisMonth();
  if (miss.length) out.push({t:`Invoice ${periodLabel(thisPeriod())} rent`, s:miss.map(t => t.name).join(', '), tone:'warn', act:'data-nav="rentals"'});
  for (const t of activeTenants()){ const d = daysUntil(t.end); if (d != null && d <= 60) out.push({t:`Tenancy ${d < 0 ? 'expired' : 'ending'} · ${t.name}`, s:`${t.property || ''} · ${d < 0 ? 'ended' : 'ends'} ${fmtDate(t.end)}`, tone: d < 0 ? 'bad' : 'warn', act:`data-act="edit" data-id="${esc(t.id)}"`}); }
  if (st.items.size && st.mode === 'live' && st.db === localDb){ const b = daysSince(st.settings.lastBackup); if (b == null || b > 30) out.push({t:'Back up your data', s: b == null ? 'No backup saved yet' : `Last backup ${fmtDate(st.settings.lastBackup)}`, tone:'warn', act:'data-act="settings"'}); }
  const noPlan = kindItems('benef').filter(b => b.passesBy === 'No plan yet');
  if (noPlan.length) out.push({t:`${noPlan.length} asset${noPlan.length > 1 ? 's' : ''} with no succession plan`, s:noPlan.slice(0,3).map(b => b.asset).join(', '), tone:'bad', act:'data-nav="succession" data-sub="benef"'});
  return out;
}

async function recordPay(){
  const r = st.items.get(invId), f = $('#pay-form'), e = $('#perr');

  const next = {...r, paidAmount:String(paidAmt(r) + amt), paidOn:f.paidOn.value, method:f.method.value || r.method || '', updatedAt:new Date().toISOString()};

async function unpay(){
  const r = {...st.items.get(invId)}; delete r.paidAmount; delete r.paidOn; delete r.method; r.updatedAt = new Date().toISOString();
  st.items.set(invId, r); await write(invId, r); toast('Marked as unpaid'); openInvoice(invId);
}

async function saveInvoice(){
  const f = $('#inv-form'), e = $('#ierr');
  const t = tenants().find(x => x.id === f.tenantId.value);
  if (!f.period.value){ e.hidden = false; e.textContent = 'Pick the month.'; return; }
  if (n(f.amount.value) == null){ e.hidden = false; e.textContent = 'Enter the rent amount.'; return; }
  if (invId){
    const r = {...st.items.get(invId), period:f.period.value, amount:f.amount.value, issued:f.issued.value, due:f.due.value, desc:f.desc.value, updatedAt:new Date().toISOString()};
    delete r.example; st.items.set(invId, r); await write(invId, r); toast('Invoice saved'); openInvoice(invId); return;
  }
  if (rents().some(r => r.tenantId === t.id && r.period === f.period.value) && !f.dataset.dupOk){
    f.dataset.dupOk = '1'; e.hidden = false; e.textContent = `${t.name} already has an invoice for ${periodLabel(f.period.value)}. Tap Create invoice again to make another.`; return;
  }
  const id = newId(), r = makeRent(t, f.period.value, {amount:f.amount.value, issued:f.issued.value, due:f.due.value, desc:f.desc.value});
  st.items.set(id, r); await write(id, r); toast('Invoice created'); openInvoice(id);

function fieldHtml(f, data){
  const val = data[f.k] ?? '', id = 'f-' + f.k;

  if (f.t === 'select') ctl = `<select id="${id}" name="${f.k}"><option value="">—</option>${f.o.map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.t === 'textarea') ctl = `<textarea id="${id}" name="${f.k}">${esc(val)}</textarea>`;
  else if (f.t === 'number') ctl = `<input id="${id}" name="${f.k}" type="text" inputmode="decimal" value="${esc(val)}" placeholder="${esc(f.ph || '')}">`;
  else if (f.t === 'date') ctl = `<input id="${id}" name="${f.k}" type="date" value="${esc(val)}">`;

function readForm(){
  const out = {}; const f = $('#item-form'); if (!f) return out;

}
function liveCalc(){
  const box = $('#calc'); if (!box || !editing) return;
  const d = {kind:editing.kind, ...readForm()}; let msg = '';
  const v = value(d), inc = income(d);
  if (['land','gold','deposit','invest','loan'].includes(d.kind) && v != null){
    msg = (d.kind === 'loan' ? 'Your liability: ' : d.kind === 'land' ? 'Your share: ' : 'Value: ') + RM(v);

  }
  if (d.kind === 'gold' && n(d.weight) > 0 && n(d.purity) > 0 && !gp()) msg = 'Set the gold price in Settings to value this automatically.';
  box.hidden = !msg; box.textContent = msg;

const ID_RE = /\b\d{6}-?\d{2}-?\d{4}\b|\d{12,}/;
async function saveForm(){
  if (!editing) return;
  const d = readForm(), err = $('#ferr');
  const req = FIELDS[editing.kind].find(f => f.req && !d[f.k]);
  if (req){ err.hidden = false; err.textContent = `Add ${req.l.toLowerCase()} to save.`; return; }
  const bad = Object.entries(d).find(([, v]) => typeof v === 'string' && ID_RE.test(v));
  if (bad){ err.hidden = false; err.textContent = `"${FIELDS[editing.kind].find(f => f.k === bad[0])?.l}" looks like an IC or account number. Remove it and note where the document is kept instead.`; return; }
  const numBad = FIELDS[editing.kind].find(f => f.t === 'number' && d[f.k] && n(d[f.k]) == null);
  if (numBad){ err.hidden = false; err.textContent = `${numBad.l} needs a number.`; return; }
  const clean = {kind:editing.kind};
  for (const [k, v] of Object.entries(d)) if (v !== '') clean[k] = v;
  if (editing.title) clean.title = editing.title;
  clean.updatedAt = new Date().toISOString();
  const id = editing.id, wasNew = editing.isNew;
  st.items.set(id, clean); closeSheet(); render();
  await write(id, clean);
  toast(wasNew ? 'Added' : 'Saved');
}

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== st.view){ st.view = h; render(); } });

/* ---------- phone storage ---------- */
const STORE_KEY = 'harta-data-v1', PIN_KEY = 'harta-pin-v1';
function loadStore(){
  try { const j = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); if (j && typeof j === 'object') return j; } catch(e){}
  return {items:{}, settings:{}};
}
function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({items:Object.fromEntries(st.items), settings:st.settings})); }
  catch(e){ toast('Could not save on this phone. Back up your data now.'); throw e; }
}
const localDb = {
  collection: () => ({ doc: id => ({ set: async d => { st.items.set(id, d); persist(); }, delete: async () => { st.items.delete(id); persist(); } }) }),
  doc: () => ({ set: async d => { st.settings = d; persist(); } }),
};
const MIME = {pdf:'application/pdf', csv:'text/csv', json:'application/json'};
const localDownloads = { save: async ({filename, data}) => {
  const type = MIME[filename.split('.').pop()] || 'application/octet-stream';
  const blob = new Blob([data], {type});
  try {
    const file = new File([blob], filename, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return {status:'saved'}; }
  } catch(e){ if (e && e.name === 'AbortError') throw {code:'declined'}; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return {status:'saved'};
}};

/* ---------- backup & restore ---------- */
async function backup(){
  const payload = {app:'harta', version:1, exportedAt:new Date().toISOString(), items:Object.fromEntries(st.items), settings:st.settings};
  try {
    await localDownloads.save({filename:`Keystone backup ${today()}.json`, data:JSON.stringify(payload, null, 1)});
    st.settings = {...st.settings, lastBackup:today()}; persist(); toast('Backup ready'); closeSheet();
  } catch(e){ if (!e || e.code !== 'declined') toast("Couldn't create the backup. Try again."); }
}
let pendingRestore = null;
function readRestore(file){
  const r = new FileReader();
  r.onload = () => {
    let j = null; try { j = JSON.parse(r.result); } catch(e){}
    const slot = $('#restore-slot');
    if (!j || j.app !== 'harta' || typeof j.items !== 'object'){ slot.innerHTML = '<div class="err" style="margin-top:4px">That file isn\'t a Keystone backup. Pick a file named "Keystone backup …json".</div>'; return; }
    pendingRestore = j;
    const cnt = Object.keys(j.items).length;
    slot.innerHTML = `<div class="confirm">Replace everything on this phone with the backup from ${esc(fmtDate((j.exportedAt || '').slice(0, 10)))} (${cnt} entries)?<div class="r"><button class="btn danger" data-act="do-restore" type="button">Replace and restore</button><button class="btn ghost" data-act="no-restore" type="button">Cancel</button></div></div>`;
  };
  r.readAsText(file);
}
function doRestore(){
  const j = pendingRestore; if (!j) return;
  st.items = new Map(Object.entries(j.items)); st.settings = j.settings || {};
  persist(); pendingRestore = null; closeSheet(); toast('Data restored');
}
document.addEventListener('change', e => { if (e.target.id === 'restore-file' && e.target.files[0]) readRestore(e.target.files[0]); });

/* ---------- passcode ---------- */
const pinHash = () => { try { return localStorage.getItem(PIN_KEY); } catch(e){ return null; } };
async function hashPin(pin){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('harta:' + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function lock(){ const l = $('#lock'); if (!l.hidden) return; l.hidden = false; $('#lock-msg').textContent = ''; $('#lock-pin').value = ''; setTimeout(() => $('#lock-pin').focus(), 50); }
$('#lock-form').addEventListener('submit', async e => {
  e.preventDefault();
  const v = $('#lock-pin').value.trim();
  if (await hashPin(v) === pinHash()){ $('#lock').hidden = true; $('#lock-pin').value = ''; }
  else { $('#lock-msg').textContent = 'Wrong passcode. Try again.'; $('#lock-pin').value = ''; }
});
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (pinHash() && hiddenAt && Date.now() - hiddenAt > 120000) lock();
});
async function setPin(){
  const v = ($('#pin-new').value || '').trim(), err = $('#pin-err');
  if (!/^\d{4,6}$/.test(v)){ err.hidden = false; err.textContent = 'Use 4 to 6 digits.'; return; }
  try { localStorage.setItem(PIN_KEY, await hashPin(v)); } catch(e){ err.hidden = false; err.textContent = "Couldn't save the passcode on this phone."; return; }
  closeSheet(); toast('Passcode on. The app locks when opened and after 2 minutes away.');
}
function clearPin(){ try { localStorage.removeItem(PIN_KEY); } catch(e){} closeSheet(); toast('Passcode off'); }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- boot ---------- */
{ const h = location.hash.slice(1); st.view = VIEWS.includes(h) ? h : 'overview'; }
render();
(async () => {
  st.db = localDb; st.downloads = localDownloads; st.mode = 'live'; st.loaded = true;
  const d = loadStore();
  st.items = new Map(Object.entries(d.items || {})); st.settings = d.settings || {};
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if (pinHash()) lock();
  render();
})();
})();
</script>
</body>
